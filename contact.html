<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | DeskMate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-blue-600">DeskMate</a>
            <div class="hidden md:flex space-x-6">
                <a href="index.html" class="hover:text-blue-500">Home</a>
                <a href="katalog.html" class="hover:text-blue-500">Catalog</a>
                <a href="about.html" class="hover:text-blue-500">About</a>
                <a href="contact.html" class="text-blue-600 font-semibold">Contact</a>
            </div>
            <button id="mobile-menu-btn" class="md:hidden font-bold text-xl">☰</button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden flex-col bg-white mt-2 p-4 space-y-3 shadow-inner">
            <a href="index.html" class="block hover:text-blue-500">Home</a>
            <a href="katalog.html" class="block hover:text-blue-500">Catalog</a>
            <a href="about.html" class="block hover:text-blue-500">About</a>
            <a href="contact.html" class="block text-blue-600 font-semibold">Contact</a>
        </div>
    </nav>

    <main class="container mx-auto p-6 flex-grow">
        <h2 class="text-3xl font-bold mb-8 text-center mt-4">Hubungi Kami</h2>
        
        <div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-md">
            <form onsubmit="event.preventDefault(); alert('Pesan berhasil dikirim!');">
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2" for="nama">Nama Lengkap</label>
                    <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" id="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-bold mb-2" for="email">Email</label>
                    <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="email" id="email" placeholder="email@contoh.com" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2" for="pesan">Pesan</label>
                    <textarea class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" id="pesan" rows="4" placeholder="Tulis pertanyaan atau pesanan Anda..." required></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">Kirim Pesan</button>
            </form>
        </div>
    </main>

    <footer class="bg-gray-900 text-white text-center p-6 mt-12">
        <p>&copy; 2026 DeskMate. All rights reserved.</p>
    </footer>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => { menu.classList.toggle('hidden'); menu.classList.toggle('flex'); });
    </script>
</body>
</html>
